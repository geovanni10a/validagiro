name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: validagiro
          POSTGRES_USER: validagiro_owner
          POSTGRES_PASSWORD: owner_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U validagiro_owner -d validagiro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://validagiro_runtime:runtime_test_only@localhost:5432/validagiro?schema=public
      DIRECT_DATABASE_URL: postgresql://validagiro_owner:owner_test_only@localhost:5432/validagiro?schema=public
      TEST_DATABASE_URL: postgresql://validagiro_owner:owner_test_only@localhost:5432/validagiro?schema=public
      RUNTIME_DATABASE_URL: postgresql://validagiro_runtime:runtime_test_only@localhost:5432/validagiro?schema=public
      DEV_AUTH_ENABLED: "true"
      DEV_AUTH_SUBJECT: dev-user-geovanni
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @validagiro/api prisma:deploy
      - name: Enable the non-owner runtime login
        run: docker exec "${{ job.services.postgres.id }}" psql -U validagiro_owner -d validagiro -c "ALTER ROLE validagiro_runtime LOGIN PASSWORD 'runtime_test_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
      - run: pnpm db:seed && pnpm db:seed
      - run: pnpm contracts:generate
      - run: pnpm contracts:lint
      - name: Verify generated contract drift
        run: git diff --exit-code -- packages/contracts/openapi.json packages/contracts/src/generated-api.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @validagiro/contracts typecheck
      - run: pnpm --filter @validagiro/api test:integration
      - run: pnpm audit --prod --audit-level high

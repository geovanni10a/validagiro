packages:
  - apps/*
  - packages/*

overrides:
  'js-yaml@>=5.0.0 <=5.2.1': 5.2.2
  'postcss@<=8.5.22': 8.5.23
  'uuid@<11.1.1': 11.1.1

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
